<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أنتيكا بورتريه - نظام الشحن</title>
    <style>
        :root { --primary: #8c6239; --bg: #f9f6f0; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; text-align: center; }
        .card { background: var(--primary); color: white; padding: 20px; border-radius: 10px; display: inline-block; margin-bottom: 20px; min-width: 200px; }
        .number { font-size: 3rem; font-weight: bold; }
        table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background: #eee; color: var(--primary); }
    </style>
</head>
<body>

    <h1>Antika Portrait - نظام الشحن</h1>
    
    <div class="card">
        <div>إجمالي طرود اليوم</div>
        <div id="totalToday" class="number">0</div>
    </div>

    <table>
        <thead>
            <tr>
                <th>رقم الطرد</th>
                <th>اسم العميل</th>
                <th>المحافظة</th>
                <th>رقم الهاتف</th>
            </tr>
        </thead>
        <tbody id="packageTable">
            </tbody>
    </table>

    <script>
        // مصفوفة تجريبية للبيانات (بدلاً من قاعدة البيانات)
        const packages = [
            {id: 1, name: "محمد علي", city: "القاهرة", phone: "010xxx"},
            {id: 2, name: "أحمد حسن", city: "الإسكندرية", phone: "012xxx"}
        ];

        // عرض الإجمالي
        document.getElementById('totalToday').innerText = packages.length;

        // عرض الجدول
        const tableBody = document.getElementById('packageTable');
        packages.forEach(pkg => {
            tableBody.innerHTML += `
                <tr>
                    <td>#${pkg.id}</td>
                    <td>${pkg.name}</td>
                    <td>${pkg.city}</td>
                    <td>${pkg.phone}</td>
                </tr>`;
        });
    </script>
</body>
</html>
