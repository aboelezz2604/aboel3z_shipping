<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antika Portrait - نظام بوالص الشحن المتطور</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header h1 {
            color: #1a1a1a;
            font-size: 26px;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        .form-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #444;
        }

        input, textarea, select {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #1a1a1a;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #333333;
        }

        .btn-print {
            background-color: #2e7d32;
            color: #ffffff;
        }

        .btn-print:hover {
            background-color: #1b5e20;
        }

        .btn-clear {
            background-color: #c62828;
            color: #ffffff;
        }

        .btn-clear:hover {
            background-color: #b71c1c;
        }

        .table-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        th {
            background-color: #f8f9fa;
            color: #555;
        }

        .btn-action {
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            margin-left: 4px;
        }

        .btn-delete {
            background-color: #ffebee;
            color: #c62828;
        }

        .btn-edit {
            background-color: #e3f2fd;
            color: #1565c0;
        }

        #print-container {
            display: block;
        }

        .a4-page {
            background: white;
            width: 210mm;
            height: 297mm;
            padding: 6mm 8mm;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 3mm;
            box-sizing: border-box;
        }

        .policy-card {
            border: 2px solid #000;
            height: 54mm;
            padding: 8px 15px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            background: #fff;
            overflow: hidden;
        }

        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 38px;
            font-weight: 900;
            color: rgba(0, 0, 0, 0.04);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            font-family: Arial, sans-serif;
        }

        .brand-boxes {
            width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 1;
        }

        .brand-title {
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 0.5px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .box-unit {
            border: 1.5px solid #000;
            width: 100%;
            text-align: center;
            border-radius: 3px;
            overflow: hidden;
        }

        .box-header {
            background: #f0f0f0;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 0;
            border-bottom: 1px solid #000;
            color: #333;
        }

        .box-body {
            font-size: 18px;
            font-weight: bold;
            padding: 4px 0;
            background: #fff;
        }

        .client-info {
            flex: 1;
            padding-right: 15px;
            text-align: right;
            z-index: 1;
        }

        .info-row {
            margin-bottom: 3px;
            font-size: 15px;
            color: #000;
            line-height: 1.3;
        }

        .info-row strong {
            font-weight: 700;
            display: inline-block;
            min-width: 85px;
        }

        .info-row.phone {
            font-size: 16px;
            font-weight: bold;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }

            body * {
                visibility: hidden;
            }

            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            #print-container, #print-container * {
                visibility: visible;
            }

            #print-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            .a4-page {
                width: 210mm;
                height: 297mm;
                padding: 5mm 8mm;
                margin: 0;
                box-shadow: none;
                page-break-after: always;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                gap: 3mm;
                box-sizing: border-box;
            }

            .policy-card {
                height: 54mm;
                border: 2px solid #000;
                padding: 8px 15px;
            }

            .info-row {
                font-size: 15px;
                line-height: 1.3;
            }

            .info-row.phone {
                font-size: 16px;
            }

            .brand-boxes {
                width: 140px;
            }

            .box-body {
                font-size: 18px;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container no-print">
    <header>
        <h1>Antika Portrait - إدارة بوالص الشحن</h1>
        <p>نظام إدخال وطباعة البوالص (5 بوالص في صفحة A4 كاملة)</p>
    </header>

    <div class="form-card">
        <form id="policy-form">
            <input type="hidden" id="edit-index" value="-1">
            <div class="form-grid">
                <div class="form-group">
                    <label for="client-name">اسم العميل:</label>
                    <input type="text" id="client-name" required placeholder="مثال: هنا محمد">
                </div>
                <div class="form-group">
                    <label for="client-phone">رقم الهاتف:</label>
                    <input type="text" id="client-phone" required placeholder="مثال: 01005337863 / 01061822857">
                </div>
                <div class="form-group">
                    <label for="item-code">الكود:</label>
                    <input type="text" id="item-code" required placeholder="مثال: D2395">
                </div>
                <div class="form-group">
                    <label for="item-price">السعر (ج.م):</label>
                    <input type="text" id="item-price" required placeholder="مثال: 300">
                </div>
                <div class="form-group">
                    <label for="item-size">المقاس:</label>
                    <input type="text" id="item-size" placeholder="مثال: 3 * 30*40">
                </div>
                <div class="form-group">
                    <label for="notes">ملاحظات:</label>
                    <input type="text" id="notes" placeholder="مثال: الإتنين">
                </div>
                <div class="form-group full-width">
                    <label for="client-address">العنوان التفصيلي:</label>
                    <textarea id="client-address" rows="2" required placeholder="مثال: البحيرة دمنهور ش عرابي أمام مسجد التوبة عمارة طمان"></textarea>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary" id="btn-save">إضافة بوليصة</button>
                <button type="button" class="btn btn-print" onclick="window.print()">طباعة البوالص 🖨️</button>
                <button type="button" class="btn btn-clear" onclick="clearAllPolicies()">مسح الكل 🗑️</button>
            </div>
        </form>
    </div>

    <div class="table-card">
        <h3>قائمة البوالص المدخلة (<span id="count">0</span>)</h3>
        <br>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الكود</th>
                    <th>اسم العميل</th>
                    <th>الهاتف</th>
                    <th>العنوان</th>
                    <th>السعر</th>
                    <th>المقاس</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="policies-table-body">
            </tbody>
        </table>
    </div>
</div>

<div id="print-container">
</div>

<script>
    function convertArabicDigitsToEnglish(str) {
        if (!str) return '';
        const arabicDigits = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        let result = str.toString();
        for (let i = 0; i < 10; i++) {
            result = result.replace(arabicDigits[i], i);
        }
        return result;
    }

    document.querySelectorAll('input, textarea').forEach(element => {
        element.addEventListener('input', function() {
            this.value = convertArabicDigitsToEnglish(this.value);
        });
    });

    let policies = JSON.parse(localStorage.getItem('antika_policies')) || [];

    const form = document.getElementById('policy-form');
    const tableBody = document.getElementById('policies-table-body');
    const printContainer = document.getElementById('print-container');
    const countSpan = document.getElementById('count');

    function saveAndRender() {
        localStorage.setItem('antika_policies', JSON.stringify(policies));
        renderTable();
        renderPrintPages();
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const editIndex = parseInt(document.getElementById('edit-index').value);

        const policyData = {
            name: convertArabicDigitsToEnglish(document.getElementById('client-name').value),
            phone: convertArabicDigitsToEnglish(document.getElementById('client-phone').value),
            code: convertArabicDigitsToEnglish(document.getElementById('item-code').value),
            price: convertArabicDigitsToEnglish(document.getElementById('item-price').value),
            size: convertArabicDigitsToEnglish(document.getElementById('item-size').value),
            notes: convertArabicDigitsToEnglish(document.getElementById('notes').value),
            address: convertArabicDigitsToEnglish(document.getElementById('client-address').value)
        };

        if (editIndex === -1) {
            policies.push(policyData);
        } else {
            policies[editIndex] = policyData;
            document.getElementById('edit-index').value = "-1";
            document.getElementById('btn-save').textContent = "إضافة بوليصة";
        }

        form.reset();
        saveAndRender();
    });

    function renderTable() {
        tableBody.innerHTML = '';
        countSpan.textContent = policies.length;

        policies.forEach((p, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><strong>${p.code}</strong></td>
                <td>${p.name}</td>
                <td>${p.phone}</td>
                <td>${p.address}</td>
                <td>${p.price} ج.م</td>
                <td>${p.size || '-'}</td>
                <td>
                    <button class="btn-action btn-edit" onclick="editPolicy(${index})">تعديل</button>
                    <button class="btn-action btn-delete" onclick="deletePolicy(${index})">حذف</button>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    window.editPolicy = function(index) {
        const p = policies[index];
        document.getElementById('client-name').value = p.name;
        document.getElementById('client-phone').value = p.phone;
        document.getElementById('item-code').value = p.code;
        document.getElementById('item-price').value = p.price;
        document.getElementById('item-size').value = p.size;
        document.getElementById('notes').value = p.notes;
        document.getElementById('client-address').value = p.address;

        document.getElementById('edit-index').value = index;
        document.getElementById('btn-save').textContent = "تحديث البوليصة";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deletePolicy = function(index) {
        if (confirm('هل أنت تأكد من حذف هذه البوليصة؟')) {
            policies.splice(index, 1);
            saveAndRender();
        }
    };

    window.clearAllPolicies = function() {
        if (policies.length === 0) return;
        if (confirm('هل أنت تأكد من مسح جميع البوالص؟')) {
            policies = [];
            saveAndRender();
        }
    };

    function renderPrintPages() {
        printContainer.innerHTML = '';

        if (policies.length === 0) return;

        let currentPage = null;

        policies.forEach((p, index) => {
            if (index % 5 === 0) {
                currentPage = document.createElement('div');
                currentPage.className = 'a4-page';
                printContainer.appendChild(currentPage);
            }

            const card = document.createElement('div');
            card.className = 'policy-card';

            card.innerHTML = `
                <div class="watermark">Antika portrait</div>
                
                <div class="brand-boxes">
                    <div class="brand-title">Antika portrait</div>
                    <div class="box-unit">
                        <div class="box-header">الكود</div>
                        <div class="box-body">${p.code}</div>
                    </div>
                    <div class="box-unit">
                        <div class="box-header">السعر</div>
                        <div class="box-body">${p.price}</div>
                    </div>
                </div>

                <div class="client-info">
                    <div class="info-row"><strong>اسم العميل:</strong> ${p.name}</div>
                    <div class="info-row phone"><strong>رقم الهاتف:</strong> ${p.phone}</div>
                    <div class="info-row"><strong>العنوان:</strong> ${p.address}</div>
                    ${p.size ? `<div class="info-row"><strong>المقاس:</strong> ${p.size}</div>` : ''}
                    ${p.notes ? `<div class="info-row"><strong>ملاحظات:</strong> ${p.notes}</div>` : ''}
                </div>
            `;

            currentPage.appendChild(card);
        });
    }

    renderTable();
    renderPrintPages();
</script>

</body>
</html>
