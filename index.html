<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنتيكا بورترييه - نظام البوالص</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 20px;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>أنتيكا بورترييه - بيانات الشحن</h2>
    <form id="shippingForm">
        <div class="form-group">
            <label for="clientName">اسم العميل:</label>
            <input type="text" id="clientName" placeholder="أدخل اسم العميل">
        </div>

        <div class="form-group">
            <label for="phone">رقم الهاتف:</label>
            <!-- تم ربط حدث oninput بدالة تحويل الأرقام مباشرة -->
            <input type="tel" id="phone" placeholder="01122345678" oninput="fixNumbers(this)">
        </div>
    </form>
</div>

<script>
    // دالة تحويل الأرقام الشرقية (العربية) إلى أرقام إنجليزية فورية
    function fixNumbers(inputField) {
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        const persianNumbers = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
        
        let val = inputField.value;

        for (let i = 0; i < 10; i++) {
            val = val.replace(arabicNumbers[i], i).replace(persianNumbers[i], i);
        }

        // تحديث قيمة الخانة بالأرقام الإنجليزية
        inputField.value = val;
    }
</script>

</body>
</html>
